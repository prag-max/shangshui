# =====================================================================
#  frpc.toml —— 本机 Windows 客户端配置
#  放在本机，随 frpc.exe 一起运行：  frpc.exe -c frpc.toml
#  作用：把本机 127.0.0.1:8000 的 Laravel 后端，穿透到云服务器的公网端口。
# =====================================================================

# 云服务器（跑 frps 的那台）的公网 IP
serverAddr = "43.139.72.9"
# 与 frps.toml 的 bindPort 一致
serverPort = 7000

# 鉴权：token 必须与 frps.toml 完全一致
auth.method = "token"
auth.token = "3ffdd987107b10e3d739b9d44bc993762c5fd0bfc5b6ca50"

# 断线自动重连
transport.heartbeatInterval = 30
transport.heartbeatTimeout = 90

[[proxies]]
name = "shanwater-backend"
type = "tcp"
# 本机 Laravel 监听地址（start-backend.bat 里绑定的 127.0.0.1:8000）
localIP = "127.0.0.1"
localPort = 8000
# 云服务器上对外开放的端口（高端口，避开 80/443 的备案限制）
# Phase 1：curl http://43.139.72.9:18000/api/inquiries 验证链路
# Phase 2：由云上 Caddy 反代到它，对外只暴露 https 子域名
remotePort = 18000
