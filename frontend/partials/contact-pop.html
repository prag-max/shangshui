<div class="contact-pop" id="contactPop" aria-hidden="true" role="dialog" aria-modal="true" aria-label="联系我们">
  <div class="contact-pop__overlay" data-contact-close></div>
  <div class="contact-pop__panel">
    <button class="contact-pop__close" type="button" aria-label="关闭">&times;</button>
    <h2 class="contact-pop__title">联系我们</h2>
    <p class="contact-pop__sub">预约免费演示，获取定制化供水营收解决方案</p>

    <div class="contact-pop__info">
      <div class="contact-pop__info-item">
        <span class="contact-pop__icon">
          <svg aria-hidden="true"><use href="#ph-phone"></use></svg>
        </span>
        <div>
          <strong>咨询热线</strong>
          <b class="phone-hl">{{site.tel}}</b>
        </div>
      </div>
      <div class="contact-pop__info-item">
        <span class="contact-pop__icon">
          <svg aria-hidden="true"><use href="#ph-envelope"></use></svg>
        </span>
        <div>
          <strong>邮箱</strong>
          {{site.email}}
        </div>
      </div>
      <div class="contact-pop__qr">
        <div class="contact-pop__qr-item">
          <img src="assets/images/qr-wechat-public.png" alt="尚水数字微信公众号二维码" loading="lazy" width="120" height="120">
          <span>微信公众号</span>
        </div>
        <div class="contact-pop__qr-item">
          <img src="assets/images/qr-wechat-contact.png" alt="尚水数字微信客服二维码" loading="lazy" width="120" height="120">
          <span>微信咨询</span>
        </div>
      </div>
    </div>

    <form id="inquiry-form" class="contact-pop__form" novalidate>
      <div class="contact-pop__form-grid">
        <div class="field">
          <label for="c-name">姓名 *</label>
          <input type="text" id="c-name" name="name" placeholder="请输入您的姓名" required aria-required="true">
        </div>
        <div class="field">
          <label for="c-company">单位名称 *</label>
          <input type="text" id="c-company" name="company" placeholder="请输入您的单位名称" required aria-required="true">
        </div>
        <div class="field">
          <label for="c-phone">联系电话 *</label>
          <input type="tel" id="c-phone" name="phone" placeholder="请输入您的联系电话" required aria-required="true">
        </div>
        <div class="field">
          <label for="c-email">邮箱</label>
          <input type="email" id="c-email" name="email" placeholder="请输入您的邮箱地址">
        </div>
      </div>
      <div class="field">
        <label for="c-req">需求描述</label>
        <input type="text" id="c-req" name="requirement" placeholder="如：想了解抄表到收费一体化方案">
      </div>
      <input type="text" name="website" tabindex="-1" autocomplete="off" aria-hidden="true" class="honeypot-field">
      <button class="btn-submit" type="submit">提交预约</button>
      <p class="form-msg" id="form-msg" role="status" aria-live="polite"></p>
    </form>
  </div>
</div>
